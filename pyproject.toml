[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-sync"
version = "0.1.2"
description = "Multi-sensor synchronization, temporal calibration, and timing validation for robot-learning data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "embodied-sync contributors" }]
keywords = [
  "robotics",
  "robot-learning",
  "multi-sensor-synchronization",
  "temporal-alignment",
  "clock-skew",
  "clock-drift",
  "latency",
  "jitter",
  "lerobot",
  "datasets",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

# Keep the base install light. Anything heavier goes behind extras (D-0001).
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://anicut-ai.github.io/embodied-sync/"
Documentation = "https://anicut-ai.github.io/embodied-sync/"
Source = "https://github.com/anicut-ai/embodied-sync"
Issues = "https://github.com/anicut-ai/embodied-sync/issues"

[project.optional-dependencies]
# Layered on purpose (D-0001). The base install is numpy + pyyaml and
# nothing else, because the thing most consumers want -- read timestamps,
# fit a clock mapping, check an alignment -- is pure arithmetic. Every
# heavier capability is opt-in, so a robotics CI image that only needs the
# estimator does not end up compiling OpenCV.
#
#   Layer 1  base install .................. core types, time/clock domains,
#                                            calibrate (estimator, events,
#                                            clap, semantic), align, session,
#                                            corrupt, synthetic streams
#   Layer 2  [adapters] ..................... read/write other people's formats
#   Layer 3  [tools] ........................ verification and inspection
#            [full] ......................... layers 1-3 together
#
# `pip install embodied-sync` gets layer 1. `pip install embodied-sync[full]`
# gets the bells and whistles.

# --- Layer 2: format adapters, one per ecosystem -------------------------
mcap = ["mcap>=1.1"]
# pyarrow alone covers the native v3.0 reader/exporter; the full lerobot
# package is only needed to consume the exported dataset with their tooling.
# `av` is named explicitly rather than taken transitively from `lerobot`:
# `audit-lerobot-pts` demuxes video packet timestamps itself, and a
# dependency an audit needs must not be one another package happens to pull.
lerobot = ["pyarrow>=14.0", "av>=12.0", "lerobot>=0.1"]
lsl = ["pylsl>=1.16", "pyxdf>=1.16"]
surg_sync = ["pyarrow>=14.0"]
umi = ["zarr>=3.0", "numcodecs>=0.12"]
# HDF5 is read by `ingest.probe` and the QUT adapter, both of which import it
# inside the function body and degrade gracefully when it is missing. It was
# previously absent from every extra, so the only way to get it was to
# already have it -- and its absence silently disabled array-shape probing.
hdf5 = ["h5py>=3.8"]

adapters = [
  "embodied-sync[mcap]",
  "embodied-sync[lerobot]",
  "embodied-sync[lsl]",
  "embodied-sync[surg_sync]",
  "embodied-sync[umi]",
  "embodied-sync[hdf5]",
]

# --- Layer 3: verification and inspection tooling ------------------------
rerun = ["rerun-sdk>=0.15"]
# Frame decoding for the QR / screen-timestamp calibrator (D-0038). The
# *fit* is numpy-only and always available; only `decode_timestamp_frames`
# needs these. Deliberately NOT in `full`: pyzbar needs the system libzbar0
# shared library, so including it would make an install fail on a bare CI
# image. Ask for it explicitly when you have the system library.
calibrate-vision = ["opencv-python>=4.8", "pyzbar>=0.1.9"]
# The alignment inspector renders decoded frames and audio excerpts into a
# self-contained HTML page a person can judge. It needs no extra Python
# packages -- media decoding shells out to `ffmpeg`/`ffprobe`, and WAV
# reading is stdlib `wave` -- so this extra exists to pull in the HDF5 and
# rerun readers its dataset bindings use, and to give the capability a name.
# **`ffmpeg` and `ffprobe` must be on PATH**; there is no pip package for
# that, and the inspector reports a clear error when they are missing.
inspect = ["embodied-sync[hdf5]"]

tools = [
  "embodied-sync[rerun]",
  "embodied-sync[inspect]",
]

# --- Aggregates ----------------------------------------------------------
full = [
  "embodied-sync[adapters]",
  "embodied-sync[tools]",
]
# Retained as the historical alias for `full` so existing installs keep
# working; new callers should prefer `[full]`, which names the layering.
all = [
  "embodied-sync[full]",
]

dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
embsync = "embodied_sync.cli.main:main"

[tool.setuptools.packages.find]
include = ["embodied_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "optional_dep: requires an optional extra (mcap/lerobot/lsl/surg_sync/umi/rerun); skips when missing",
  "external_data: requires a manually provided local dataset under EMBODIED_SYNC_EXTERNAL_DATA_ROOT; skips when missing",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Keep lint behavior stable across Ruff releases. Newer Ruff versions enable a
# much broader evolving rule set by default; this project historically gates
# on Ruff's original pyflakes/pycodestyle correctness set.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# No python_version pin: numpy's stubs use PEP 695 `type` statements, which
# mypy rejects when told to check as 3.10/3.11 (DECISIONS.md D-0008).
strict = true
packages = ["embodied_sync"]

# Optional adapter/exporter dependencies (mcap, lerobot, pyarrow, pylsl,
# pyxdf, zarr/numcodecs, rerun/rerun_sdk) are only imported inside function bodies so a base
# install stays lightweight (D-0001 + tests/test_optional_deps.py).
# Their stub quality varies and their packages sometimes trip mypy's
# "found twice under different module names" heuristic; skip
# following into them entirely so type-checking `embodied_sync`
# doesn't depend on the extras being installed.
[[tool.mypy.overrides]]
module = ["mcap.*", "lerobot.*", "pyarrow.*", "av.*", "pylsl.*", "pyxdf.*", "zarr.*", "numcodecs.*", "rerun.*", "rerun_sdk.*", "h5py.*"]
follow_imports = "skip"
ignore_missing_imports = true
